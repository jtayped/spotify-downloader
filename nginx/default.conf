events { worker_connections 1024; }

http {
    server {
        listen 80;

        # 1. Traffic for the Go Backend
        location /api/ {
            # 'backend' matches your service name in docker-compose
            proxy_pass http://backend:1323/; 
            
            # Standard headers for passing IP info to Go
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Everything else goes to Next.js
        location / {
            proxy_pass http://frontend:3000;
            
            # Required for Next.js features
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}